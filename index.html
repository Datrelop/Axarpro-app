<title>AXARPRO 360° · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002D68;
    --navy-light:#0B4A9E;
    --green:#65C800;
    --green-dark:#4C9600;
    --grey:#5C6470;
    --grey-light:#F3F5F7;
    --white:#ffffff;
    --danger:#D64545;
    --warn:#E6A400;
    --radius:16px;
    --shadow: 0 8px 24px rgba(0,45,104,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    background: radial-gradient(circle at 20% 0%, #0B3A80 0%, var(--navy) 45%, #001433 100%);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 12px;
    color:var(--navy);
  }
  .phone{
    width:420px;
    max-width:100%;
    background:var(--grey-light);
    border-radius:40px;
    box-shadow: 0 40px 80px rgba(0,10,30,0.55), 0 0 0 8px #051530, 0 0 0 9px rgba(101,200,0,0.35);
    overflow:hidden;
    position:relative;
    min-height:820px;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    background:var(--navy);
    color:white;
    font-size:11px;
    padding:10px 22px 2px;
    display:flex;
    justify-content:space-between;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    opacity:0.7;
    position:relative;
    z-index:2;
  }
  .topbar{
    background: linear-gradient(135deg, var(--navy) 0%, #013a7a 100%);
    color:white;
    padding:8px 18px 22px;
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    border-bottom:3px solid var(--green);
  }
  .topbar .backbtn{
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
    border:none;color:white;
  }
  .topbar .backbtn:hover{background:rgba(255,255,255,0.22);}
  .topbar-title{
    font-family:'Montserrat',sans-serif;
    font-weight:800;
    font-size:17px;
    flex:1;
  }
  .topbar-sub{
    font-size:11px;
    opacity:0.75;
    font-weight:500;
    margin-top:1px;
  }
  .role-chip{
    background:var(--green);
    color:var(--navy);
    font-weight:700;
    font-size:10px;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .content{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 90px;
  }
  #app{display:flex;flex-direction:column;flex:1;min-height:0;}
  .content::-webkit-scrollbar{width:0;}
  h1,h2,h3{font-family:'Montserrat',sans-serif;color:var(--navy);margin:0;}
  .card{
    background:white;
    border-radius:var(--radius);
    padding:16px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
    border:1px solid rgba(0,45,104,0.05);
  }
  .action-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:white;
    border-radius:var(--radius);
    padding:15px 16px;
    box-shadow:var(--shadow);
    margin-bottom:11px;
    cursor:pointer;
    border:1px solid rgba(0,45,104,0.05);
    border-left:3px solid transparent;
    width:100%;
    text-align:left;
    font-family:'Poppins',sans-serif;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .action-card:hover{border-left-color:var(--green);}
  .action-card:active{transform:scale(0.98);}
  .action-icon{
    width:46px;height:46px;
    border-radius:13px;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    flex-shrink:0;
    box-shadow:0 4px 10px rgba(0,45,104,0.25);
  }
  .action-text h3{font-size:14.5px;margin-bottom:2px;font-weight:700;letter-spacing:0.1px;}
  .action-text p{font-size:12px;color:var(--grey);margin:0;line-height:1.3;}
  .arrow{margin-left:auto;color:#C7CDD5;font-size:18px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--green);
    color:var(--navy);
    font-weight:800;
    font-family:'Poppins',sans-serif;
    letter-spacing:0.2px;
    border:none;
    padding:14px 20px;
    border-radius:14px;
    font-size:14.5px;
    cursor:pointer;
    width:100%;
    box-shadow:0 6px 16px rgba(101,200,0,0.35);
    transition:filter 0.15s, transform 0.1s;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:scale(0.98);}
  .btn-navy{background:var(--navy);color:white;box-shadow:0 6px 16px rgba(0,45,104,0.3);}
  .btn-outline{background:white;color:var(--navy);border:2px solid var(--navy);box-shadow:none;}
  .btn-danger{background:var(--danger);color:white;box-shadow:0 6px 16px rgba(214,69,69,0.3);}

function submitCommunityLogin(){
  const r = state.route.find(x=>x.id===state.pendingCommunityId);
  if(!r) return;
  const name = document.getElementById('commName').value.trim();
  const vivienda = document.getElementById('commVivienda').value.trim();
  const code = document.getElementById('commCode').value.trim();
  if(!name || !vivienda || !code){ showToast('Rellena todos los campos','⚠️'); return; }
  if(!state.vecinoProfile.privacyAccepted){ document.getElementById('commLoginError').textContent = 'Debes aceptar la política de privacidad para continuar.'; return; }
  let isPresident;
  if(code === r.presidentCode) isPresident = true;
  else if(code === r.vecinoCode) isPresident = false;
  else {
    document.getElementById('commLoginError').textContent = 'Código no válido para esta comunidad.';
    return;
  }
  state.vecinoProfile.name = name;
  state.vecinoProfile.vivienda = vivienda;
  state.currentCommunity = r.name;
  state.isPresident = isPresident;
  state.role = 'vecino';
  state.pendingCommunityId = r.id;
  if(window.fbSaveVecinoProfile){
    window.fbSaveVecinoProfile({ name, vivienda, comunidadId: r.id, isPresident, privacyAccepted:true, updatedAt: new Date().toISOString() });
  }
  go('home');
}

screens.incidentFlow = () => {
  const step = state.incidentStep;
  const sev = state.incidentSeverity;
  const isUrgente = sev === 'urgente';
  const president = state.incidentAsPresident;
  let body = '';
  const TOTAL_STEPS = 4;
  const dots = (activeIdx) => `
    <div class="step-dots">
      ${[0,1,2,3].map(i=>`<div class="step-dot ${i<activeIdx?'done':i===activeIdx?'active':''}"></div>`).join('')}
    </div>`;

  if(step===0){
    body = `
    <div class="content">
      ${dots(0)}
      <div class="step-icon-badge" style="background:#FBE1E1;">📸</div>

      </div>

      <input type="file" accept="image/*" id="galleryInput" class="visually-hidden-input" onchange="handlePhotoFile(event)">
      <div style="display:flex;gap:10px;margin-bottom:18px;">
        <label for="cameraInput" class="btn btn-navy" style="flex:1;">📷 Hacer foto</label>
        <label for="galleryInput" class="btn btn-outline" style="flex:1;">🖼️ Galería</label>
      </div>
      <button class="btn" ${!state.incidentPhoto?'disabled':''} onclick="state.incidentStep=1;render()">Continuar</button>
      ${!state.incidentPhoto? `<p style="font-size:11.5px;color:var(--grey);text-align:center;margin-top:10px;">También puedes continuar sin foto si es urgente.</p><button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px;" onclick="state.incidentStep=1;render()">Continuar sin foto</button>`:''}
    </div>`;
  } else if(step===1){
    body = `
    <div class="content">
      ${dots(1)}
      <div class="step-icon-badge" style="background:#E4EBF7;">💬</div>
      <div style="text-align:center;margin-bottom:16px;">
        <h2 style="font-size:16.5px;margin-bottom:6px;">Cuéntanos qué pasa</h2>
        <p style="font-size:13px;color:var(--grey);">Una frase y la ubicación son suficientes.</p>
      </div>
      <label class="field-label">Ubicación</label>
      <select id="incLocation">
        ${['Portal','Garaje','Piscina','Zona común / jardín','Ascensor','Otro'].map(l=>`<option ${state.incidentLocation===l?'selected':''}>${l}</option>`).join('')}
      </select>
      <label class="field-label">¿Qué ha pasado?</label>
      <textarea id="incNote" placeholder="Ej: La luz del garaje no enciende">${state.incidentNote}</textarea>
      <button class="btn" onclick="saveNoteAndNext()">Continuar</button>
    </div>`;
  } else if(step===2){
    const canContinue = sev && (!isUrgente || (state.incidentDisclaimerAccepted && (president || state.incidentGraveRisk!==null)));
    body = `
    <div class="content">
      ${dots(2)}
      <div style="text-align:center;margin-bottom:6px;">
        <h2 style="font-size:16.5px;margin-bottom:6px;">¿Qué gravedad tiene?</h2>
        <p style="font-size:13px;color:var(--grey);">Elige el nivel que mejor describe la situación.</p>
      </div>
      <div class="severity-row">
        <button class="severity-btn sev-normal ${sev==='normal'?'selected':''}" onclick="setSeverity('normal')"><span>🟢</span>Normal</button>
        <button class="severity-btn sev-prioritaria ${sev==='prioritaria'?'selected':''}" onclick="setSeverity('prioritaria')"><span>🟡</span>Prioritaria</button>
        <button class="severity-btn sev-urgente ${sev==='urgente'?'selected':''}" onclick="setSeverity('urgente')"><span>🔴</span>Urgente</button>
      </div>
      <p class="severity-desc">${severityDesc(sev)}</p>
      ${isUrgente ? `
        <div class="disclaimer-box">
          <p>⚠️ Las actuaciones urgentes fuera del horario habitual pueden generar costes adicionales. Si la actuación requiere desplazamiento inmediato, dichos costes podrán ser facturados a la comunidad según las condiciones del contrato.</p>
          <label class="disclaimer-check" onclick="toggleDisclaimer()">
            <div class="checkbox ${state.incidentDisclaimerAccepted?'checked':''}">${state.incidentDisclaimerAccepted?'✓':''}</div>
            <span>He leído y acepto las condiciones de una actuación urgente.</span>
          </label>
        </div>
        ${president ? `
          <div class="card" style="background:#E4EBF7;box-shadow:none;">
            <p style="font-size:12.5px;color:var(--navy);margin:0;">👑 Como Presidente, tu autorización queda registrada automáticamente al enviar.</p>
          </div>
        ` : `
          <div class="grave-risk-box">
            <p>¿Hay riesgo grave para personas o para el inmueble? <span style="font-weight:400;color:var(--grey);">(fuga importante, incendio, riesgo eléctrico, inundación, bloqueo total de acceso)</span></p>
            <div class="grave-risk-row">
              <button class="rating-btn ${state.incidentGraveRisk===true?'sel-bad':''}" onclick="setGraveRisk(true)">Sí, es grave</button>
              <button class="rating-btn ${state.incidentGraveRisk===false?'sel-good':''}" onclick="setGraveRisk(false)">No</button>
            </div>
          </div>
        `}
      ` : ''}
      <button class="btn ${isUrgente?'btn-danger':''}" ${!canContinue?'disabled':''} onclick="goToConfirmStep()">Continuar</button>
    </div>`;
  } else if(step===3){
    const willBePending = isUrgente && !president && state.incidentGraveRisk===false;
    const willBeImmediate = isUrgente && (president || state.incidentGraveRisk===true);
    body = `
    <div class="content">
      ${dots(3)}
      <h2 style="font-size:16px;margin-bottom:14px;text-align:center;">Confirma y envía</h2>
      <div class="card">
        <p style="font-size:11px;color:var(--grey);text-transform:uppercase;font-weight:700;letter-spacing:0.4px;margin:0 0 3px;">Comunidad</p>
        <p style="font-size:13.5px;font-weight:600;color:var(--navy);margin:0 0 12px;">🏘️ ${currentCommunityName()}</p>
        <div class="divider" style="margin:0 0 12px;"></div>
        <p style="font-size:11px;color:var(--grey);text-transform:uppercase;font-weight:700;letter-spacing:0.4px;margin:0 0 3px;">Reportado por</p>
        <p style="font-size:13.5px;font-weight:600;color:var(--navy);margin:0;">🙋 ${state.vecinoProfile.name} · 🏠 ${state.vecinoProfile.vivienda}</p>
      </div>
      <div class="card">
        ${state.incidentPhotoData
          ? `<div class="photo-slot filled" style="max-width:110px;margin-bottom:14px;background:url('${state.incidentPhotoData}') center/cover;"></div>`
          : `<p style="font-size:12.5px;color:var(--grey);margin-bottom:10px;">📷 Sin foto adjunta</p>`}
        <p style="font-size:13.5px;margin:0 0 6px;"><b>Ubicación:</b> ${state.incidentLocation||'Portal'}</p>
        <p style="font-size:13.5px;margin:0;"><b>Nota:</b> ${state.incidentNote || '(sin nota)'}</p>
        <p style="font-size:11.5px;color:var(--grey);margin:8px 0 0;">🕒 Se registrará a las <b>${nowLabel()}</b></p>
        <div style="margin:10px 0;">
          <span class="pill ${sev==='urgente'?'pill-danger':sev==='prioritaria'?'pill-warn':'pill-green'}">${sev==='urgente'?'🔴 Urgente':sev==='prioritaria'?'🟡 Prioritaria':'🟢 Normal'}</span>
        </div>
        <div class="divider"></div>
        <p style="font-size:12px;color:var(--grey);margin:0;">
          ${willBePending
            ? '🟠 Quedará <b>pendiente de autorización</b> del administrador de fincas o el presidente antes de actuar fuera de horario.'
            : willBeImmediate
              ? '🚨 AXARPRO actuará <b>de inmediato</b>. Queda registrada la hora, motivo y fotos.'
              : `📤 Se enviará a AXARPRO y al operario más cercano.`}
        </p>
      </div>
      <button class="btn ${isUrgente?'btn-danger':''}" onclick="sendIncident()">${isUrgente? '🚨 Enviar' : 'Enviar incidencia 🚀'}</button>
    </div>`;
  } else {
    const lastInc = state.incidents[0];
    const pending = lastInc && lastInc.status === 'pendiente autorización';
    const immediate = isUrgente && !pending;
    body = `
    <div class="content">
      <div class="empty-state" style="padding-top:20px;">
        <div class="step-icon-badge" style="background:${pending?'#FFF3D6':'#E7F7D9'};width:76px;height:76px;font-size:34px;">${pending?'🟠':'✅'}</div>
        <h2 style="font-size:18px;margin-bottom:10px;">${pending? 'Enviado · pendiente de autorización' : isUrgente? '¡Urgencia enviada!' : '¡Incidencia enviada!'}</h2>
        <div class="ticket-chip">${state.incidentSent}</div>
        <p style="font-size:13.5px;margin-top:10px;">${
          pending
            ? 'Hemos notificado al administrador de fincas y al presidente para que autoricen la actuación fuera de horario.'
            : immediate
              ? 'Un operario ha sido notificado <b>de inmediato</b>.'
              : sev==='prioritaria'
                ? 'Tiempo de respuesta estimado<br><b>menos de 24h</b>'
                : 'Tiempo de respuesta estimado<br><b>24-48h</b> (Plan Estándar)'
        }</p>
      </div>
      <div class="card" style="text-align:left;">
        <p style="font-size:11px;color:var(--grey);text-transform:uppercase;font-weight:700;letter-spacing:0.4px;margin:0 0 8px;">Registro guardado</p>
        <p style="font-size:12.5px;margin:0 0 4px;">🏘️ ${lastInc?.community || currentCommunityName()}</p>
        <p style="font-size:12.5px;margin:0 0 4px;">🙋 ${lastInc?.reportedBy || state.vecinoProfile.name} · 🏠 ${lastInc?.vivienda || state.vecinoProfile.vivienda}</p>
        <p style="font-size:12.5px;margin:0;">🕒 ${lastInc?.reportedAt || nowLabel()}</p>
      </div>
      <button class="btn" onclick="resetIncidentFlow();go('home')">Volver al inicio</button>
    </div>`;
  }
  const title = president ? '👑 Reporte de urgencia' : 'Reportar incidencia';
  return topbar(title, step<TOTAL_STEPS? `Paso ${step+1} de ${TOTAL_STEPS}` : 'Completado', step<TOTAL_STEPS? 'home': null) + body;
};

function severityDesc(sev){
  if(sev==='normal') return 'Se atenderá dentro del plazo estándar de tu plan.';
  if(sev==='prioritaria') return 'Nos comprometemos a resolverlo en menos de 24 horas.';
  if(sev==='urgente') return 'Requiere una actuación inmediata, hoy mismo.';
  return 'Esto nos ayuda a priorizar correctamente tu incidencia.';
}

function startNormalReport(){ resetIncidentFlow(); go('incidentFlow'); }
function startUrgentReport(){ resetIncidentFlow(); state.incidentAsPresident=true; state.incidentSeverity='urgente'; go('incidentFlow'); }

function setSeverity(s){
  state.incidentSeverity = s;
  if(s!=='urgente'){ state.incidentDisclaimerAccepted=false; state.incidentGraveRisk=null; }
  render();
}
function toggleDisclaimer(){ state.incidentDisclaimerAccepted = !state.incidentDisclaimerAccepted; render(); }
function setGraveRisk(v){ state.incidentGraveRisk = v; render(); }

function goToConfirmStep(){
  state.incidentTimestamp = new Date();
  state.incidentStep = 3;
  render();
}
function nowLabel(){
  const d = state.incidentTimestamp || new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm} · ${hh}:${min}h`;
}

function handlePhotoFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    state.incidentPhoto = true;
    state.incidentPhotoData = e.target.result;
    render();
    showToast('Foto añadida','📷');
  };
  reader.readAsDataURL(file);
}
function saveNoteAndNext(){
  state.incidentNote = document.getElementById('incNote').value;
  state.incidentLocation = document.getElementById('incLocation').value;
  state.incidentStep=2;
  render();
}
function sendIncident(){
  const nameVal = state.vecinoProfile.name;
  const viviendaVal = state.vecinoProfile.vivienda;
  if(!nameVal || !viviendaVal){
    showToast('Vuelve a entrar desde Comunidades para identificarte','⚠️');
    return;
  }
  const sev = state.incidentSeverity;
  const president = state.incidentAsPresident;
  let prefix = 'INC-';
  let status = 'en curso';
  let authorizedBy = null;
  if(sev==='urgente'){
    prefix = 'SOS-';
    if(president){ status='en curso'; authorizedBy='Presidente (auto)'; }
    else if(state.incidentGraveRisk===true){ status='en curso'; authorizedBy='Riesgo grave (auto)'; }
    else { status='pendiente autorización'; }
  }
  const num = prefix + Math.floor(2000+Math.random()*900);
  const record = {
    id:num,
    title: state.incidentNote || (sev==='urgente'?'Incidencia urgente':'Incidencia reportada'),
    status, date:'hoy',
    severity: sev,
    location: state.incidentLocation || 'Portal',
    community: currentCommunityName(),
    reportedBy: nameVal,
    vivienda: viviendaVal,
    reportedAt: nowLabel(),
    authorizedBy,
    photo: state.incidentPhotoData
  };
  state.incidents.unshift(record);
  if(window.fbWriteIncident) window.fbWriteIncident(record);
  if(status==='pendiente autorización'){
    state.pendingAuthorizations.unshift({id:num, title:record.title, location:record.location, community: currentCommunityName(), date:'hoy', reportedBy:`${nameVal} (${viviendaVal})`});
  }
  state.incidentSent = num;
  state.incidentStep = 4;
  render();
}
function resetIncidentFlow(){
  state.incidentStep=0;
  state.incidentPhoto=false;
  state.incidentPhotoData=null;
  state.incidentNote='';
  state.incidentLocation='';
  state.incidentSeverity=null;
  state.incidentGraveRisk=null;
  state.incidentDisclaimerAccepted=false;
  state.incidentAsPresident=false;
  state.incidentSent=null;
  state.incidentTimestamp=null;
}

screens.pendingAuth = () => topbar('Autorizaciones pendientes', 'Actuaciones urgentes fuera de horario', 'home') + `
  <div class="content">
    ${(() => {
      const visible = myVisibleCommunityNames();
      const items = state.pendingAuthorizations.filter(p => visible.includes(p.community||currentCommunityName()));
      if(items.length===0) return `<div class="empty-state"><div class="emoji">✅</div><p>No hay autorizaciones pendientes</p></div>`;
      return items.map(p=>`
      <div class="auth-card">
        <span class="pill pill-warn">🟠 Pendiente</span>
        <h3 style="font-size:14px;margin:10px 0 3px;">${p.title}</h3>
        <p style="font-size:12px;color:var(--grey);margin:0 0 12px;">🏘️ ${p.community||currentCommunityName()} · 📍 ${p.location} · ${p.reportedBy} · ${p.date}</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm" style="flex:1;" onclick="decideAuth('${p.id}','aprobado')">✅ Aprobar</button>
          <button class="btn btn-outline btn-sm" style="flex:1;" onclick="decideAuth('${p.id}','esperar')">🕒 Horario normal</button>
        </div>
      </div>`).join('');
    })()}
  </div>`;

function decideAuth(id, decision){
  state.pendingAuthorizations = state.pendingAuthorizations.filter(p=>p.id!==id);
  const inc = state.incidents.find(i=>i.id===id);
  if(inc){
    inc.status = decision==='aprobado' ? 'en curso' : 'pendiente (horario normal)';
    inc.authorizedBy = decision==='aprobado' ? (ROLE_META[state.role]?.label || 'Autorizado') : null;
    if(window.fbWriteIncident) window.fbWriteIncident(inc);
  }
  showToast(decision==='aprobado' ? 'Actuación urgente aprobada' : 'Se atenderá en horario normal', decision==='aprobado'?'✅':'🕒');
  if(state.role==='administrador'){ render(); } else { go('pendingAuth'); }
}

function submitStaffLogin(){
  const role = state.pendingStaffRole;
  const cfg = STAFF_ROLES[role];
  const code = document.getElementById('staffCode').value.trim();
  if(!code){ showToast('Indica tu código de acceso','⚠️'); return; }
  const match = state.employees.find(e=>e.role===cfg.employeeRole && e.status==='activo' && e.code===code);
  if(!match){
    document.getElementById('staffLoginError').textContent = 'Código no válido o no autorizado para este perfil.';
    return;
  }
  state[cfg.profileKey] = { id: match.id, name: match.name, code };
  state.role = role;
  showToast(`Bienvenido, ${match.name}`,'✅');
  go('home');
}

function getExtraRequestStatus(routeId, item){
  const req = state.extraTaskRequests.find(r=>r.routeId===routeId && r.item===item);
  return req ? req.status : null;
}
function toggleExtraRequestForm(rowKey){
  state.expandedExtraRequest = state.expandedExtraRequest===rowKey? null : rowKey;
  render();
}
function submitExtraRequest(communityName, item, routeId){
  const detail = (document.getElementById('extNoteInput').value || '').trim();
  if(!detail){ showToast('Cuéntanos brevemente qué ha pasado','⚠️'); return; }
  state.extraTaskRequests.unshift({
    id:'EXT-'+Math.floor(1000+Math.random()*900),
    community: communityName, item, detail, routeId,
    operario: state.operarioProfile.name || 'Operario',
    status:'revisión', date:'hoy'
  });
  state.expandedExtraRequest = null;
  showToast(navigator.onLine? 'Enviado al Supervisor para revisión' : 'Guardado · se enviará cuando haya conexión', navigator.onLine? '📤':'📴');
  render();
}

function toggleReprogramForm(maintId){
  state.expandedReprogram = state.expandedReprogram===maintId? null : maintId;
  state.reprogramReasonSel = null;
  render();
}
function setReprogramReason(reason){ state.reprogramReasonSel = reason; render(); }
function submitReprogramReport(maintId, communityName){
  if(!state.reprogramReasonSel){ showToast('Elige un motivo','⚠️'); return; }
  const note = (document.getElementById('reprogNote')?.value || '').trim();
  const m = state.maintenancePlans.find(x=>x.id===maintId);
  state.reprogramRequests.unshift({
    id:'RPR-'+Math.floor(1000+Math.random()*900),
    maintId, community: communityName, category: m? m.category : '',
    reason: state.reprogramReasonSel, note,
    requestedBy: state.operarioProfile.name || 'Operario',
    date:'hoy', status:'pendiente'
  });
  state.expandedReprogram = null;
  state.reprogramReasonSel = null;
  showToast('Retraso reportado a AXARPRO','📤');
  render();
}

function formatTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return `${m}:${s}`;
}
function startJob(){
  state.activeJob.startedAt = Date.now();
  const rt = state.route.find(x=>x.id===state.activeJob.routeId);
  rt.status = 'en curso';
  render();
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    state.activeJob.elapsed += 1;
    const disp = document.getElementById('timerDisplay');
    if(disp) disp.textContent = formatTime(state.activeJob.elapsed);
  },1000);
  showToast('Entrada registrada · contador iniciado','⏱️');
}
function toggleCheck(key){ state.activeJob.checklist[key] = !state.activeJob.checklist[key]; render(); }
function togglePhoto(which){ state.activeJob[which] = !state.activeJob[which]; render(); }
function finishJob(){
  clearInterval(timerInterval);
  const rt = state.route.find(x=>x.id===state.activeJob.routeId);
  rt.status = 'completado';
  rt.completedBy = state.operarioProfile.name || 'Operario';
  state.activeJob = null;
  if(navigator.onLine){
    showToast('Servicio cerrado con evidencia fotográfica','✅');
  } else {
    showToast('Guardado en el dispositivo · se sincronizará al recuperar conexión','📴');
  }
  go('home');
}

  state.budgets.unshift({

    amount: cost,

function communityLineItems(communityName){
  const items = [];
  const route = state.route.find(r=>r.name===communityName);
  if(route){
    items.push({label:`Cuota mensual · Plan ${route.plan}`, sub:'Servicio recurrente contratado', base: PLAN_PRICES[route.plan]||0, type:'base'});
  }
  state.budgets.filter(b=>b.community===communityName && b.status==='aprobado').forEach(b=>{
    const amount = parseFloat((b.amount+'').replace(/[^\d.]/g,'')) || 0;
    items.push({label: b.title, sub:'Presupuesto aprobado', base: amount, type:'extra'});
  });
  state.incidents.filter(i=>i.community===communityName && i.severity==='urgente' && i.status==='en curso').forEach(i=>{
    items.push({label:`Urgencia: ${i.title}`, sub:'Actuación fuera de horario', base: 60, type:'urgencia'});
  });
  return items;
}
function applySurcharge(item){
  let pct = 0;
  if(item.type==='urgencia') pct = state.surcharges.urgencia;
  const total = item.base * (1 + pct/100);
  return { ...item, surchargePct: pct, total };
}

function renderInvoicePreview(routeId){
  const r = state.route.find(x=>x.id===routeId);
  if(!r) return topbar('Factura', null, 'billing') + `<div class="content"><div class="empty-state"><p>Comunidad no encontrada</p></div></div>`;
  const items = communityLineItems(r.name).map(applySurcharge);
  const subtotal = items.reduce((s,it)=>s+it.total,0);
  const iva = subtotal*0.21;
  const grandTotal = subtotal+iva;
  const num = 'FRA-2026-' + String(r.id).padStart(3,'0');
  return topbar('Vista previa', r.name, 'billing') + `

          <p style="font-weight:700;color:var(--navy);margin:0;">${num}</p>
          <p style="margin:0;">Borrador · no válida a efectos fiscales</p>
        </div>
      </div>
      <p style="font-size:13px;color:var(--navy);font-weight:700;margin:0 0 4px;">${r.name}</p>

        <div class="inv-row">
          <span class="inv-label">${it.label}${it.surchargePct>0?`<span class="inv-sub">Recargo urgencia +${it.surchargePct}%</span>`:''}</span>
          <span>${it.total.toFixed(2)}€</span>
        </div>`).join('')}
      <div class="inv-total-row"><span>Subtotal</span><span>${subtotal.toFixed(2)}€</span></div>
      <div class="inv-total-row" style="font-weight:400;color:var(--grey);"><span>IVA (21%)</span><span>${iva.toFixed(2)}€</span></div>
      <div class="inv-grand-total"><span>Total</span><span>${grandTotal.toFixed(2)}€</span></div>
    </div>
    <button class="btn btn-navy no-print" style="margin-top:16px;" onclick="window.print()">🖨️ Imprimir / Guardar como PDF</button>
    <p class="no-print" style="font-size:11px;color:var(--grey);text-align:center;margin-top:10px;">Borrador de uso interno. Para facturas con validez fiscal, conecta tu gestoría o software contable.</p>
  </div>`;
}

function submitChangeMasterCode(){
  const me = state.employees.find(e=>e.role==='Admin AXARPRO');
  const current = document.getElementById('currentMasterCode').value.trim();
  const nuevo = document.getElementById('newMasterCode').value.trim();
  const confirm = document.getElementById('confirmMasterCode').value.trim();
  const phone = document.getElementById('recoveryPhone').value.trim();
  const errEl = document.getElementById('changeCodeError');
  if(!me){ errEl.textContent = 'No se encuentra tu perfil de Gerente.'; return; }
  if(current !== me.code){ errEl.textContent = 'El código actual no es correcto.'; return; }
  if(!nuevo || nuevo.length<4){ errEl.textContent = 'El nuevo código debe tener al menos 4 dígitos.'; return; }
  if(nuevo !== confirm){ errEl.textContent = 'Los dos códigos nuevos no coinciden.'; return; }
  me.code = nuevo;
  me.recoveryPhone = phone;
  state.axarproProfile.code = nuevo;
  showToast('Código de acceso actualizado','🔑');
  go('home');
}

function toggleTeamMember(id, name){

function togglePause(id){
  const m = state.maintenancePlans.find(x=>x.id===id);
  if(!m) return;
  m.paused = !m.paused;
  showToast(m.paused? 'Mantenimiento pausado':'Mantenimiento reanudado', m.paused?'⏸️':'▶️');

}
function toggleAdminReprogram(id){ state.expandedAdminReprogram = state.expandedAdminReprogram===id? null : id; render(); }
function confirmReprogram(maintId){
  const m = state.maintenancePlans.find(x=>x.id===maintId);
  if(!m) return;
  const dateInput = document.getElementById('reprogDate-'+maintId);
  const val = dateInput ? dateInput.value : '';
  if(!val){ showToast('Elige una fecha','⚠️'); return; }
  const d = new Date(val+'T00:00:00');
  const label = d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'});
  m.nextDate = label;
  m.status = 'al día';
  state.expandedAdminReprogram = null;
  const pendingReq = state.reprogramRequests.find(rq=>rq.maintId===maintId && rq.status==='pendiente');
  if(pendingReq) pendingReq.status = 'confirmado';
  showToast(`Reprogramada para el ${label}`,'📅');
  render();
}

function generateICS(events){
  const pad = n => String(n).padStart(2,'0');
  const toICSDate = d => d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  let out = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//AXARPRO//Ruta//ES\r\n';
  events.forEach((ev,i)=>{
    out += 'BEGIN:VEVENT\r\n';
    out += 'UID:'+Date.now()+'-'+i+'@axarpro.com\r\n';
    out += 'DTSTAMP:'+toICSDate(new Date())+'Z\r\n';
    out += 'DTSTART:'+toICSDate(ev.start)+'\r\n';
    out += 'DTEND:'+toICSDate(ev.end)+'\r\n';
    out += 'SUMMARY:'+ev.title+'\r\n';
    if(ev.description) out += 'DESCRIPTION:'+ev.description.replace(/\n/g,'\\n')+'\r\n';
    out += 'END:VEVENT\r\n';
  });
  out += 'END:VCALENDAR\r\n';
  return out;
}
function downloadICS(filename, content){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(isIOS){
    // Safari/iOS ignora a menudo el atributo download en Blobs: abrimos con data URI para que el propio Safari ofrezca "Añadir a Calendario" o "Compartir"
    const dataUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(content);
    window.location.href = dataUri;
  } else {
    const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
}
function exportDayICS(){
  const today = new Date();

    const start = new Date(today.getFullYear(), today.getMonth(), today.getDate(), parts[0], parts[1]);

    return {title:`AXARPRO · ${r.name}`, start, end, description:`Plan ${r.plan}. Equipo: ${(r.team||[]).join(', ')||'sin asignar'}`};
  });
  if(events.length===0){ showToast('No hay comunidades activas para exportar','⚠️'); return; }
  downloadICS('axarpro_ruta_hoy.ics', generateICS(events));
  showToast('Ruta del día exportada (.ics)','📅');
}
function exportWeekICS(){
  const events = [];
  const today = new Date();
  state.weekAgenda.forEach((day, dayIndex) => {
    const eventDate = new Date(today.getFullYear(), today.getMonth(), today.getDate()+dayIndex);
    day.jobs.forEach(jobStr => {
      const match = jobStr.match(/(\d{2}):(\d{2})/);

      const end = new Date(start.getTime()+2*60*60*1000);
      events.push({title:`AXARPRO · ${jobStr.split(' · ')[0]}`, start, end, description: jobStr});
    });
  });
  downloadICS('axarpro_ruta_semana.ics', generateICS(events));

}

function moveRouteStop(id, direction){
  const activeItems = state.route.filter(r=>r.active!==false);
  const idx = activeItems.findIndex(r=>r.id===id);
  const swapIdx = idx+direction;
  if(swapIdx<0 || swapIdx>=activeItems.length) return;
  // swap within the full state.route array (find real indices)
  const realIdxA = state.route.findIndex(r=>r.id===activeItems[idx].id);
  const realIdxB = state.route.findIndex(r=>r.id===activeItems[swapIdx].id);
  [state.route[realIdxA], state.route[realIdxB]] = [state.route[realIdxB], state.route[realIdxA]];
  state.route.forEach((r,i)=>{ r.order = i; });
  if(window.fbWriteRoute){ window.fbWriteRoute(state.route[realIdxA]); window.fbWriteRoute(state.route[realIdxB]); }
  render();
}
function timeToMinutes(t){ const [h,m] = (t||'00:00').split(':').map(Number); return h*60+m; }
function hasTimeConflict(stopA, stopB){
  const diff = Math.abs(timeToMinutes(stopA.time) - timeToMinutes(stopB.time));
  const required = Math.max(stopA.travelMinutes||0, stopB.travelMinutes||0, 1);
  return diff < required;
}
function updateStopTravel(id, minutes){
  const r = state.route.find(x=>x.id===id);
  if(!r) return;
  const val = Math.max(0, parseInt(minutes,10)||0);
  r.travelMinutes = val;
  showToast(`Desplazamiento hasta ${r.name}: ${val} min`,'🚗');
  if(window.fbWriteRoute) window.fbWriteRoute(r);
  render();
}
function updateStopTime(id, newTime){
  const r = state.route.find(x=>x.id===id);
  if(!r) return;
  const candidate = {...r, time:newTime};
  const namesToCheck = new Set(r.team||[]);
  if(r.schedule){ DAY_KEYS.forEach(day=>(r.schedule[day]||[]).forEach(n=>namesToCheck.add(n))); }
  for(const name of namesToCheck){
    const clash = state.route.find(other=>other.id!==id && other.active!==false && hasTimeConflict(candidate, other) && ((other.team||[]).includes(name) || (other.schedule && DAY_KEYS.some(day=>(other.schedule[day]||[]).includes(name)))));
    if(clash){
      showToast(`No se puede cambiar la hora: ${name} no llega a tiempo desde/hasta ${clash.name} (${clash.time})`,'⚠️');
      render();
      return;
    }
  }
  r.time = newTime;
  showToast(`Hora actualizada: ${r.name} a las ${newTime}`,'🕐');
  if(window.fbWriteRoute) window.fbWriteRoute(r);
  render();
}

function toggleRouteTeamEditor(id){ state.expandedRouteTeamEditor = state.expandedRouteTeamEditor===id? null : id; render(); }
function findScheduleConflict(id, name){
  const r = state.route.find(x=>x.id===id);
  if(!r) return null;
  return state.route.find(other=>other.id!==id && other.active!==false && hasTimeConflict(r, other) && (other.team||[]).includes(name)) || null;
}
function toggleRouteTeamMember(id, name){
  const r = state.route.find(x=>x.id===id);
  if(!r) return;
  if(!r.team) r.team=[];
  const idx = r.team.indexOf(name);
  if(idx>=0){ r.team.splice(idx,1); render(); return; }
  const conflict = findScheduleConflict(id, name);
  if(conflict){
    showToast(`${name} ya está asignado a ${conflict.name} a las ${conflict.time} — no le da tiempo a llegar`,'⚠️');

  r.team.push(name);

}
function confirmRouteTeam(id){
  const r = state.route.find(x=>x.id===id);

  showToast(`Equipo guardado para ${r.name}: ${teamText}`,'✅');

function findWeeklyConflict(id, day, name){

function toggleEditAdmin(id){ state.editingAdminFor = state.editingAdminFor===id? null : id; render(); }
function saveAdminFincasChange(id){

function toggleEditPlan(id){ state.editingPlanFor = state.editingPlanFor===id? null : id; render(); }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD0ugVbCjd-8HSgHaFWfvbsGU5lJL28ScM",
    authDomain: "axarpro-a68a0.firebaseapp.com",
    projectId: "axarpro-a68a0",
    storageBucket: "axarpro-a68a0.firebasestorage.app",
    messagingSenderId: "1052040350361",
    appId: "1:1052040350361:web:4b30c3a77a3833f60d8608"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUid = null;

  // Expone helpers sencillos para que el script clásico (no-module) pueda guardar/leer datos
  window.fbSaveVecinoProfile = async function(data){
    if(!currentUid) return;
    try{ await setDoc(doc(db, 'vecinos', currentUid), data, { merge:true }); }
    catch(err){ console.error('Error guardando en Firestore:', err); }
  };

  const routeCol = collection(db, 'route');
  window.fbWriteRoute = async function(stop){
    try{ await setDoc(doc(db, 'route', String(stop.id)), stop, { merge:true }); }
    catch(err){ console.error('Error guardando ruta en Firestore:', err); }
  };
  window.fbDeleteRoute = async function(id){
    try{ await deleteDoc(doc(db, 'route', String(id))); }
    catch(err){ console.error('Error eliminando ruta en Firestore:', err); }
  };

  async function initRouteSync(){
    try{
      const snap = await getDocs(routeCol);
      if(snap.empty && window.state && window.state.route && window.state.route.length){
        // Primera vez que se conecta: sube los datos de ejemplo actuales para que dejen de vivir solo en memoria
        for(let i=0; i<window.state.route.length; i++){
          const stop = window.state.route[i];
          stop.order = i;
          await setDoc(doc(db, 'route', String(stop.id)), stop);
        }
      }
    }catch(err){ console.error('Error inicializando ruta en Firestore:', err); }

    onSnapshot(routeCol, (snapshot) => {
      if(!window.state) return;
      const stops = [];
      snapshot.forEach(d => stops.push(d.data()));
      stops.sort((a,b) => (a.order??0) - (b.order??0));
      window.state.route = stops;
      if(window.render) window.render();
    });
  }
  initRouteSync();

  function makeCollectionSync(colName, stateKey){
    const col = collection(db, colName);
    const writeFn = async function(item){
      try{ await setDoc(doc(db, colName, String(item.id)), item, { merge:true }); }
      catch(err){ console.error(`Error guardando en ${colName}:`, err); }
    };
    const deleteFn = async function(id){
      try{ await deleteDoc(doc(db, colName, String(id))); }
      catch(err){ console.error(`Error eliminando en ${colName}:`, err); }
    };
    (async function init(){
      try{
        const snap = await getDocs(col);
        if(snap.empty && window.state && window.state[stateKey] && window.state[stateKey].length){
          // Primera vez que se conecta: sube los datos actuales para que dejen de vivir solo en memoria
          for(const item of window.state[stateKey]){ await setDoc(doc(db, colName, String(item.id)), item); }
        }
      }catch(err){ console.error(`Error inicializando ${colName}:`, err); }

      onSnapshot(col, (snapshot) => {
        if(!window.state) return;
        const items = [];
        snapshot.forEach(d => items.push(d.data()));
        window.state[stateKey] = items;
        if(window.render) window.render();
      });
    })();
    return { write: writeFn, delete: deleteFn };
  }

  const employeesSync = makeCollectionSync('employees', 'employees');
  window.fbWriteEmployee = employeesSync.write;
  window.fbDeleteEmployee = employeesSync.delete;

  const incidentsSync = makeCollectionSync('incidencias', 'incidents');
  window.fbWriteIncident = incidentsSync.write;

  onAuthStateChanged(auth, async (user) => {
    if(!user){ return; }
    currentUid = user.uid;
    try{
      const snap = await getDoc(doc(db, 'vecinos', currentUid));
      if(snap.exists()){
        const data = snap.data();
        const r = window.state && window.state.route && window.state.route.find(x => x.id === data.comunidadId);
        if(data.name && data.vivienda && r && window.go){
          window.state.vecinoProfile = { name: data.name, vivienda: data.vivienda, privacyAccepted: !!data.privacyAccepted };
          window.state.currentCommunity = r.name;
          window.state.isPresident = !!data.isPresident;
          window.state.role = 'vecino';
          window.state.pendingCommunityId = r.id;
          window.go('home');
        }
      }
    }catch(err){ console.error('Error leyendo Firestore:', err); }
  });

  signInAnonymously(auth).catch(err => console.error('Error de autenticación anónima:', err));
</script>
